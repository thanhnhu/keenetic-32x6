name: Build KeeneticOS for Viettel 32x6

# Manual only: Actions -> "Build KeeneticOS for Viettel 32x6" -> Run workflow.
# Builds KeeneticOS from keenetic-sdk with the stock KN-3812 image (downloaded
# from Keenetic's osvault, checked against stock/sha256sums), plus the
# bootloader on the standalone branch, and publishes a release named after the
# KeeneticOS build: 5.01.C.8.0-2, or 5.01.C.8.0-2-multifw for the *-multifw
# branch. Building the same version again replaces that release.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (off = artifact only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-keeneticos-32x6-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # bl-mt798x-dhcpd commit the bootloader patch applies to (README, Bootloader)
  BL_REPO: https://github.com/thanhnhu/bl-mt798x-dhcpd.git
  BL_BRANCH: keenetic-nr3053-mod
  BL_COMMIT: 4bb66a637

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          # stock/KN-3812_stable_5.1.8_5.01.C.8.0-2.txt -> 5.1.8, 5.01.C.8.0-2
          name=$(basename "$(ls stock/KN-3812_*.txt)" .txt)
          rel=$(echo "$name" | cut -d_ -f3)
          ver=${name##*_}
          case "$GITHUB_REF_NAME" in
            *-multifw) tag=$ver-multifw; title="KeeneticOS $rel ($ver) Multi Firmware"; standalone=false ;;
            *) tag=$ver; title="KeeneticOS $rel ($ver)"; standalone=true ;;
          esac
          echo "$tag: $name"
          { echo "name=$name"; echo "ver=$ver"; echo "tag=$tag"; echo "title=$title"
            echo "standalone=$standalone"; } >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y attr bc bsdmainutils build-essential curl file gawk git \
            gperf jq libhtml-parser-perl libjson-perl libncurses-dev libssl-dev \
            libxml-libxml-perl lzip protobuf-c-compiler python3 subversion unzip \
            zlib1g-dev xxd kmod bison flex \
            gcc-aarch64-linux-gnu device-tree-compiler python3-dev python3-setuptools \
            python3-pyelftools swig libgnutls28-dev uuid-dev

      - name: Stock image
        env:
          NAME: ${{ steps.ver.outputs.name }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          # osvault keeps builds per major version: 5.01.C.8.0-2 -> KN-3812/5.01/
          curl -fsSL --retry 3 -o "stock/$NAME.bin" \
            "https://osvault.keenetic.ru/KN-3812/${VER%%.[A-Z]*}/$NAME.bin"
          cd stock && sha256sum -c sha256sums

      - name: KeeneticOS SDK
        run: git clone --depth 1 -b "${{ steps.ver.outputs.ver }}" https://github.com/keenetic/keenetic-sdk.git "$HOME/keenetic-sdk"

      - name: Build KeeneticOS
        run: bash scripts/build-wsl.sh

      - name: Build bootloader
        if: steps.ver.outputs.standalone == 'true'
        run: |
          git clone -b "$BL_BRANCH" "$BL_REPO" "$HOME/bl"
          cd "$HOME/bl"
          git checkout "$BL_COMMIT"
          git apply "$GITHUB_WORKSPACE/bootloader/bl-mt798x-keenetic-32x6.patch"
          BOARD=keenetic_32x6 SOC=mt7981 VERSION=SP1 VARIANT=default COPY_BL2=0 \
            TOOLCHAIN=aarch64-linux-gnu- ./build.sh
          # BL2 that runs from RAM, for UART rescue with mtk_uartboot
          # same trees as VERSION=SP1 in build.sh; dtc from the U-Boot build
          export PATH="$HOME/bl/uboot-mtk-20250711/scripts/dtc:$PATH"
          cd atf-20240117-bacca82a8
          printf '%s\n' _PLAT_MT7981=y _MT7981_BOARD_BGA=y _BOOT_DEVICE_RAM=y \
            _RAM_BOOT_RAM_BOOT_UART_DL=y _DRAM_DDR3=y _LOG_LEVEL_INFO=y \
            'CROSS_COMPILE="aarch64-linux-gnu-"' > configs/mt7981_ram32x6_defconfig
          rm -rf build
          make mt7981_ram32x6_defconfig
          make bl2 -j"$(nproc)"
          cp build/mt7981/release/bl2.bin "$HOME/bl/output/bl2-32x6-ram.bin"

      - name: Collect images
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          mkdir -p out
          ls -la "$HOME/keenetic-sdk/bin/mt7981/"
          set -- "$HOME"/keenetic-sdk/bin/mt7981/*KN-3812*.bin
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one KN-3812 image, got: $*"; exit 1; }
          cp "$1" "out/KeeneticOS-32x6-$VER.bin"
          if [ "${{ steps.ver.outputs.standalone }}" = true ]; then
            cp "$HOME"/bl/output/fip-mt7981_keenetic_32x6_SP1-*.bin out/fip-keenetic-32x6.bin
            cp "$HOME/bl/output/bl2-32x6-ram.bin" out/
          fi
          (cd out && sha256sum -- * > sha256sums)
          ls -la out
          cat out/sha256sums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keeneticos-32x6-${{ steps.ver.outputs.tag }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          # same version again: replace the release and move the tag to this commit
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          git push -q origin ":refs/tags/$TAG" 2>/dev/null || true
          printf '%s\n' "$TITLE for Viettel vAP-32X6V1, branch $GITHUB_REF_NAME @ $GITHUB_SHA." \
            "" \
            "Read README.md before flashing. Check sha256sums. Never flash a stock KN-3812 image." \
            "U-Config and RF-EEPROM are per router: make them from your own Factory dump with" \
            "tools/mk_keenetic_data.py." > notes.md
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
